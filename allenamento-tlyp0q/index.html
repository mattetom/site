<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Practice">
<link rel="apple-touch-icon" href="icon.png">
<title>My Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800&family=Lexend:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="app.css">
<style>
.list { display: flex; flex-direction: column; gap: 10px; }
.ex { display: flex; gap: 14px; align-items: center; text-decoration: none; color: var(--ink); background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 12px 14px; }
.ex:active { transform: scale(.99); }
.ex .ico { font-size: 38px; flex: none; width: 52px; text-align: center; }
.ex div { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ex b { font-family: var(--display); font-size: 19px; color: var(--blue); }
.ex .best { font-size: 14px; color: var(--ink-soft); }
.ex .best.done { color: var(--ok); font-weight: 700; }
.kind { align-self: flex-start; font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--blue-bg); color: var(--blue); }
.kind.review, .kind.summary { background: var(--sun-bg); color: var(--ink); }
.kind.game { background: var(--ok-bg); color: var(--ok); }
.kind.test { background: var(--red-bg); color: var(--red); }
h2.group { margin: 14px 0 2px; font-family: var(--display); font-weight: 800; font-size: 22px; }
h2.group.next { color: var(--red); }
.testhead { margin: 8px 0 0; font-weight: 700; font-size: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <span id="hb"></span>
    <div>
      <div class="eyebrow">MY PRACTICE</div>
      <h1 id="title">Let's <span>practise!</span></h1>
      <p class="sub">Choose an exercise. Your results are saved, so we can see what to practise more.</p>
    </div>
  </header>
  <div class="list" id="list"><p class="note">Loading...</p></div>
  <p class="sync" id="sync"></p>
</div>
<script src="app.js"></script>
<script>
// The list comes from catalog.json, written by strumenti/pubblica_allenamento.py (repo scuola-margherita).
const KIND = { exercise: "Exercises", test: "Practice test", game: "Game", review: "Review sheet", summary: "Summary" };
const SUBJECTS = ["English", "Cambridge", "Science", "Geography", "History", "Maths", "Italiano"];
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const { esc, fmt } = APP;

document.getElementById("hb").innerHTML = APP.bunny("");
if (APP.name()) document.getElementById("title").innerHTML = `Hi <span>${esc(APP.name())}!</span>`;

function dayLabel(iso) { const d = new Date(iso + "T12:00:00"); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function localToday() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function card(e, best) {
  const b = best[e.id];
  const res = e.kind === "summary" || e.kind === "review" ? ""
    : b && b.score != null ? `<span class="best done">Best: ${fmt(b.score)} / ${b.max} &middot; done ${b.times} time${b.times > 1 ? "s" : ""}</span>` : `<span class="best">Not done yet</span>`;
  return `<a class="ex" href="${e.id}/${APP.carry()}"><span class="ico">${e.ico || "📘"}</span><div><span class="kind ${e.kind}">${KIND[e.kind] || esc(e.kind)}</span><b>${esc(e.title)}</b>${res}</div></a>`;
}

fetch("catalog.json").then(r => r.json()).then(items => {
  const best = APP.bests();
  const today = localToday();
  // material for a school test stays on top until the day of the test
  const next = items.filter(e => e.test && e.test >= today).sort((a, b) => a.test.localeCompare(b.test));
  let html = "";
  if (next.length) {
    html += `<h2 class="group next">Next tests</h2>`;
    let last = null;
    next.forEach(e => {
      const k = e.test + (e.testLabel || "");
      if (k !== last) html += `<p class="testhead">${esc(e.testLabel || "Test")}: ${dayLabel(e.test)}</p>`;
      last = k;
      html += card(e, best);
    });
  }
  const rest = items.filter(e => !next.includes(e));
  const others = [...new Set(rest.map(e => e.subject))].filter(s => !SUBJECTS.includes(s));
  [...SUBJECTS, ...others].filter(s => rest.some(e => e.subject === s)).forEach(s => {
    html += `<h2 class="group">${esc(s)}</h2>` + rest.filter(e => e.subject === s).map(e => card(e, best)).join("");
  });
  document.getElementById("list").innerHTML = html;
}).catch(() => { document.getElementById("list").innerHTML = `<p class="note">Oops, the list did not load. Check the internet and reload.</p>`; });
APP.status();
</script>
</body>
</html>
