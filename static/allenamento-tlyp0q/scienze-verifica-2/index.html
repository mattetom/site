<style>
/* Layout: meadow colours like the first science test; one exercise per card, inline write-in blanks, steps as a strip of dots. Engine copied from the geography test (with "redo only the wrong ones"). All in English (science rule, 22/10/2026). */
:root {
  --sea: #eef5e4; --sea-line: #dcebc8; --card: #fffdf7; --ink: #23331c; --ink-soft: #5b6b50;
  --line: #c9d8b6; --chart: #3f7f3a; --chart-bg: #e2f2dc; --buoy: #c0662b; --buoy-bg: #fbe8d8;
  --land: #2e7d32; --land-bg: #dcefd6; --miss: #b8324f; --miss-bg: #fbe4ea; --sun: #e9a400; --sun-bg: #fff2cc;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  --mono: "Fredoka", ui-monospace, "Menlo", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #121b10; --sea-line: #1b2817; --card: #1d2a19; --ink: #eef4e6; --ink-soft: #aab99c;
    --line: #34492c; --chart: #7fd27a; --chart-bg: #1f3a1c; --buoy: #ffa26b; --buoy-bg: #3e2418;
    --land: #8be08a; --land-bg: #1d3a1d; --miss: #ff8fa6; --miss-bg: #3c1b24; --sun: #ffc640; --sun-bg: #3a3014; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sea: #121b10; --sea-line: #1b2817; --card: #1d2a19; --ink: #eef4e6; --ink-soft: #aab99c;
  --line: #34492c; --chart: #7fd27a; --chart-bg: #1f3a1c; --buoy: #ffa26b; --buoy-bg: #3e2418;
  --land: #8be08a; --land-bg: #1d3a1d; --miss: #ff8fa6; --miss-bg: #3c1b24; --sun: #ffc640; --sun-bg: #3a3014; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--sea);
  background-image: linear-gradient(180deg, var(--sea) 0%, var(--sea) 70%, var(--sea-line) 100%);
  color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.5;
  min-height: 100vh; padding-inline: 16px; padding-block: 20px 40px;
}
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-family: var(--mono); font-weight: 500; font-size: 13px; letter-spacing: .06em; color: var(--chart); }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 8.5vw, 52px); line-height: 1; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 span { color: var(--buoy); }
.sub { color: var(--ink-soft); margin: 4px 0 0; font-size: 16px; max-width: 58ch; }

.tally { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.steps { display: flex; gap: 6px; }
.step { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--line); display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: 13px; color: var(--ink-soft); background: var(--card); }
.step.done { border-color: var(--land); background: var(--land-bg); color: var(--land); }
.step.now { border-color: var(--buoy); background: var(--buoy-bg); color: var(--ink); }
.pts { margin-left: auto; font-family: var(--mono); font-weight: 700; font-size: 17px; color: var(--chart); font-variant-numeric: tabular-nums; }

.card { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ex-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.ex-head b { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--chart); }
.ex-head small { color: var(--ink-soft); font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.how { margin: 0; color: var(--ink-soft); font-size: 15px; }

.bank { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; border: 2px dashed var(--chart); border-radius: 14px; }
.chip { font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--chart-bg); color: var(--ink); }
.chip.used { text-decoration: line-through; opacity: .45; }

.sent { margin: 0; line-height: 2.3; font-size: 18px; }
.fill { display: inline-flex; align-items: baseline; gap: 1px; white-space: nowrap; }
.fill .pre { font-weight: 700; color: var(--buoy); }
.fill input {
  font: inherit; font-weight: 700; line-height: 1.3; width: 9.5em; max-width: 58vw; padding: 1px 6px; border: 0; border-bottom: 2.5px solid var(--ink-soft);
  background: var(--sea); color: var(--ink); border-radius: 6px 6px 0 0;
}
.fill input:focus { outline: none; border-bottom-color: var(--buoy); background: var(--buoy-bg); }
.fill.ok input { border-bottom-color: var(--land); background: var(--land-bg); }
.fill.half input { border-bottom-color: var(--sun); background: var(--sun-bg); }
.fill.no input { border-bottom-color: var(--miss); background: var(--miss-bg); text-decoration: line-through; }
.fix { font-weight: 700; color: var(--land); margin-left: 4px; font-size: 16px; }

/* circle / true-false */
.items { display: flex; flex-direction: column; gap: 10px; }
.item { border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.item.ok { border-color: var(--land); background: var(--land-bg); }
.item.no { border-color: var(--miss); background: var(--miss-bg); }
.item p { margin: 0; font-size: 18px; }
.item .tg { display: flex; gap: 8px; flex-wrap: wrap; }
.tgb { font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; padding: 6px 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); color: var(--ink); }
.tgb[aria-pressed="true"] { border-color: var(--chart); background: var(--chart); color: var(--card); }
.why { font-size: 15px; color: var(--ink); }

button:focus-visible, input:focus-visible { outline: 3px solid var(--buoy); outline-offset: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { font: inherit; font-weight: 700; font-size: 17px; cursor: pointer; padding: 11px 18px; border-radius: 14px; border: 2px solid var(--chart); background: var(--chart); color: var(--card); }
.btn.ghost { background: transparent; color: var(--chart); }
.fill.given { font-weight: 700; color: var(--land); }
.fb { border-radius: 14px; padding: 12px 14px; font-size: 16px; display: flex; flex-direction: column; gap: 4px; }
.fb.good { background: var(--land-bg); border: 2px solid var(--land); }
.fb.mid { background: var(--sun-bg); border: 2px solid var(--sun); }
.fb strong { font-size: 18px; }

.end { display: flex; flex-direction: column; gap: 12px; }
.big { font-family: var(--display); font-weight: 800; font-size: 64px; line-height: 1; color: var(--chart); font-variant-numeric: tabular-nums; }
.grade { font-family: var(--display); font-size: 24px; font-weight: 800; }
table.res { border-collapse: collapse; width: 100%; font-size: 16px; }
table.res td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.res td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; font-family: var(--mono); }
.copy { display: flex; flex-wrap: wrap; gap: 8px; }
.copy span { font-weight: 700; padding: 4px 10px; border-radius: 10px; background: var(--buoy-bg); border: 2px solid var(--buoy); }
.tip { margin: 0; color: var(--ink-soft); font-size: 15px; }
@media (prefers-reduced-motion: no-preference) {
  .card { animation: grow .25s ease-out; }
  @keyframes grow { from { transform: scale(.985); } to { transform: none; } }
}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">SCIENCE · GRADE 4 · PRACTICE TEST 2</div>
    <h1>Science <span>test 2</span></h1>
    <p class="sub">Vertebrates and invertebrates, how animals breathe, body temperature, animal reproduction. Six exercises, 30 points. Write the words carefully: spelling counts too.</p>
  </header>
  <div class="tally"><div class="steps" id="steps"></div><div class="pts" id="pts"></div></div>
  <main class="card" id="card" aria-live="polite"></main>
</div>

<script>
// Each blank: a = accepted answers (lowercase). pre = first letter shown (exercise with hints).
// Each blank: a = accepted answers (lowercase). pre = first letter shown (exercise with hints).
// Built on the mistakes in the worksheets photographed on 15/11/2026 (see quaderno/02_...):
// ovoviviparous, adult amphibians "lungs AND skin", "insect" as a vertebrate group, tracheae, crustaceans.
const EX = [
  { id: "e1", type: "cloze", title: "1. Vertebrates and invertebrates", max: 6,
    how: "Write the words from the box. Use each word once.",
    bank: ["backbone", "exoskeleton", "six", "eight", "thorax", "abdomen"],
    sents: [
      ["Vertebrates are animals with a ", { a: ["backbone"] }, " and an internal skeleton that supports their body."],
      ["Some invertebrates have a hard outer covering called an ", { a: ["exoskeleton"] }, "."],
      ["Insects have ", { a: ["six", "6"] }, " legs. Arachnids have ", { a: ["eight", "8"] }, " legs."],
      ["The body of an insect has three parts: head, ", { a: ["thorax"] }, " and ", { a: ["abdomen"] }, "."]
    ] },
  { id: "e2", type: "pick", title: "2. Which group?", max: 6,
    how: "Choose the group of each animal.",
    items: [
      { q: "Crab", opts: ["insect", "arachnid", "crustacean", "mollusc"], a: "crustacean",
        why: "A crab has a hard exoskeleton and many jointed legs, and it lives in water: it is a crustacean." },
      { q: "Spider", opts: ["insect", "arachnid", "crustacean", "mollusc"], a: "arachnid",
        why: "A spider has eight legs and no antennae: it is an arachnid, not an insect." },
      { q: "Octopus", opts: ["fish", "arachnid", "crustacean", "mollusc"], a: "mollusc",
        why: "An octopus has a soft body: it is a mollusc, like the snail and the clam." },
      { q: "Shark", opts: ["fish", "mammal", "reptile", "amphibian"], a: "fish",
        why: "A shark lives in water, has fins and breathes through gills: it is a fish." },
      { q: "Salamander", opts: ["fish", "mammal", "reptile", "amphibian"], a: "amphibian",
        why: "A salamander lives in water and on land, like the frog and the toad: it is an amphibian." },
      { q: "Penguin", opts: ["fish", "mammal", "bird", "reptile"], a: "bird",
        why: "A penguin has feathers, wings and a beak. It cannot fly, but it is a bird." }
    ] },
  { id: "e3", type: "pick", title: "3. Vertebrate or invertebrate?", max: 4,
    how: "Choose the right answer.",
    items: [
      { q: "A bee is a ...", opts: ["vertebrate", "invertebrate"], a: "invertebrate",
        why: "A bee has no backbone: insects are invertebrates." },
      { q: "A jellyfish is a ...", opts: ["vertebrate", "invertebrate"], a: "invertebrate",
        why: "A jellyfish has no backbone and no skeleton: it is an invertebrate." },
      { q: "A snake is a ...", opts: ["vertebrate", "invertebrate"], a: "vertebrate",
        why: "A snake has a long backbone (look at the X-ray!): it is a vertebrate, a reptile." },
      { q: "Which one is a group of vertebrates?", opts: ["insects", "mammals"], a: "mammals",
        why: "Insects are invertebrates. The five vertebrate groups are fish, amphibians, reptiles, mammals and birds." }
    ] },
  { id: "e4", type: "cloze", title: "4. How animals breathe", max: 6,
    how: "There is only the first letter. Write the rest of the word.",
    sents: [
      ["Mammals, birds and reptiles breathe using their ", { pre: "l", a: ["lungs"] }, "."],
      ["Fish breathe using their ", { pre: "g", a: ["gills"] }, ". Water enters through the ", { pre: "m", a: ["mouth"] }, "."],
      ["Young amphibians breathe using gills. Adult amphibians breathe using their lungs and through their ", { pre: "s", a: ["skin"] }, "."],
      ["Insects breathe through small openings called ", { pre: "s", a: ["spiracles"] }, ", connected to tubes called ", { pre: "t", a: ["tracheae"] }, "."]
    ] },
  { id: "e5", type: "cloze", title: "5. Body temperature", max: 4,
    how: "There is only the first letter. Write the rest of the word.",
    sents: [
      ["Mammals and ", { pre: "b", a: ["birds"] }, " are warm-blooded."],
      ["Fish, amphibians and ", { pre: "r", a: ["reptiles"] }, " are cold-blooded."],
      ["Warm-blooded animals keep a ", { pre: "c", a: ["constant"] }, " body temperature."],
      ["The body temperature of cold-blooded animals changes with the ", { pre: "e", a: ["environment"] }, "."]
    ] },
  { id: "e6", type: "pick", title: "6. Animal reproduction", max: 4,
    how: "Choose the right answer.",
    items: [
      { q: "Butterfly", opts: ["oviparous", "ovoviviparous", "viviparous"], a: "oviparous",
        why: "The butterfly lays eggs and the young hatch outside the mother: oviparous." },
      { q: "Guppy", opts: ["oviparous", "ovoviviparous", "viviparous"], a: "ovoviviparous",
        why: "In the guppy the eggs stay inside the female while the young develop: ovoviviparous." },
      { q: "Dolphin", opts: ["oviparous", "ovoviviparous", "viviparous"], a: "viviparous",
        why: "The dolphin is a mammal: the young grow inside the mother, are born alive and drink milk. Viviparous." },
      { q: "True or false? In ovoviviparous animals the eggs stay inside the female's body while the young develop.", opts: ["True", "False"], a: "True",
        why: "True! Ovo = egg, vivi = alive: there is an egg, but it stays inside the mother until the young is ready." }
    ] }
];

let mode = "full";    // "full" = whole test, "redo" = only what she got wrong
let RUN = EX;         // exercises in this run
let only = {};        // redo: id -> Set of item indices to redo
let step = 0;
let scores = {};      // id -> points
let misses = {};      // id -> Set of item indices not fully right in this run
let wrongWords = [];  // correct spellings to copy
const card = document.getElementById("card");

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function clean(s) { return s.trim().toLowerCase().replace(/\s+/g, " ").replace(/[.,;!]+$/, ""); }
function dist(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
// 1 = right, 0.5 = one letter off (two for long words), 0 = wrong
function grade(typed, accepted) {
  const t = clean(typed);
  if (!t) return 0;
  if (accepted.includes(t)) return 1;
  if (accepted.some(a => a.length >= 4 && dist(t, a) <= (a.length >= 9 ? 2 : 1))) return 0.5;
  return 0;
}
function fmt(n) { return String(n).replace(".", ","); }
function total() { return Object.values(scores).reduce((a, b) => a + b, 0); }
function blanksOf(E) { return E.sents.flat().filter(p => typeof p !== "string"); }
// the word as written on the sheets (capitals for names)
function shownWord(E, B) {
  return (E.bank || []).find(w => w.toLowerCase() === B.a[0]) || (B.pre && B.pre === B.pre.toUpperCase() ? B.a[0][0].toUpperCase() + B.a[0].slice(1) : B.a[0]);
}
function redoing(E, i) { return mode !== "redo" || only[E.id].has(i); }
function maxOf(E) { return mode === "redo" ? only[E.id].size : E.max; }
function runMax() { return RUN.reduce((a, e) => a + maxOf(e), 0); }

function drawTally() {
  document.getElementById("steps").innerHTML = RUN.map((e, i) => `<span class="step ${scores[e.id] !== undefined ? "done" : ""} ${i === step ? "now" : ""}">${i + 1}</span>`).join("");
  document.getElementById("pts").textContent = mode === "redo" ? `${fmt(total())} of ${runMax()} right` : `${fmt(total())} points`;
}

function show() {
  drawTally();
  if (step >= RUN.length) return finish();
  const E = RUN[step];
  let body = "";
  if (E.type === "cloze") {
    const blanks = blanksOf(E);
    const given = blanks.filter((B, i) => !redoing(E, i)).map(B => B.a[0]);
    if (E.bank) body += `<div class="bank" id="bank">${E.bank.map(w => `<span class="chip ${given.includes(w.toLowerCase()) ? "used" : ""}" data-w="${esc(w.toLowerCase())}">${esc(w)}</span>`).join("")}</div>`;
    let k = 0;
    body += E.sents.map(s => {
      let open = false;
      const html = s.map(p => {
        if (typeof p === "string") return esc(p);
        const i = k++;
        if (!redoing(E, i)) return `<span class="fill given" data-w="${esc(p.a[0])}">${esc(shownWord(E, p))}</span>`;
        open = true;
        return `<span class="fill" data-k="${i}"><span class="pre">${esc(p.pre || "")}</span><input id="${E.id}-${i}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="missing word"></span>`;
      }).join("");
      return open ? `<p class="sent">${html}</p>` : "";
    }).join("");
  } else if (E.type === "pick") {
    body = `<div class="items">${E.items.map((it, i) => !redoing(E, i) ? "" : `<div class="item" data-i="${i}"><p>${esc(it.q)}</p><div class="tg">${it.opts.map(v => `<button type="button" class="tgb" aria-pressed="false" data-v="${esc(v)}">${esc(v)}</button>`).join("")}</div></div>`).join("")}</div>`;
  }
  card.innerHTML = `
    <div class="ex-head"><b>${esc(E.title)}</b><small>${mode === "redo" ? `${maxOf(E)} to redo` : `${E.max} points`}</small></div>
    <p class="how">${mode === "redo" ? "Redo only the wrong ones: the green parts were already right. " : ""}${esc(E.how)}</p>
    ${body}
    <div id="fb"></div>
    <div class="row"><button class="btn" id="go" type="button">Check</button></div>`;
  wire(E);
  const first = card.querySelector("input"); if (first) first.focus();
}

function wire(E) {
  const go = document.getElementById("go");
  if (E.type === "cloze" && E.bank) {
    const upd = () => {
      const typed = [...card.querySelectorAll("input")].map(i => clean(i.value)).concat([...card.querySelectorAll(".fill.given")].map(g => g.dataset.w));
      card.querySelectorAll(".chip").forEach(c => c.classList.toggle("used", typed.includes(c.dataset.w)));
    };
    card.querySelectorAll("input").forEach(i => i.addEventListener("input", upd));
  }
  if (E.type === "pick") {
    card.querySelectorAll(".item").forEach(it => it.querySelectorAll(".tgb").forEach(b => b.addEventListener("click", () => {
      it.querySelectorAll(".tgb").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    })));
  }
  card.querySelectorAll("input").forEach((inp, idx, all) => inp.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); const nx = all[idx + 1]; if (nx) nx.focus(); else go.click(); }
  }));
  go.onclick = () => check(E);
}

function check(E) {
  const fb = document.getElementById("fb");
  let pts = 0;
  const miss = new Set();
  const notes = [];
  if (E.type === "cloze") {
    const blanks = blanksOf(E);
    const empty = [...card.querySelectorAll("input")].some(i => !i.value.trim());
    if (empty && !fb.dataset.warned) { fb.dataset.warned = "1"; fb.innerHTML = `<div class="fb mid"><span>Some blanks are still empty. To check anyway, press Check again.</span></div>`; return; }
    card.querySelectorAll(".fill:not(.given)").forEach(f => {
      const k = +f.dataset.k, B = blanks[k], inp = f.querySelector("input");
      // she may retype the first letter too: try both "g"+"ills" and "gills"
      const cands = B.pre ? [B.pre + inp.value, inp.value] : [inp.value];
      const typed = cands.reduce((best, c) => grade(c, B.a) > grade(best, B.a) ? c : best, cands[0]);
      const g = grade(typed, B.a);
      const shown = shownWord(E, B);
      pts += g;
      inp.disabled = true;
      f.classList.add(g === 1 ? "ok" : g === 0.5 ? "half" : "no");
      if (g < 1) { miss.add(k); f.insertAdjacentHTML("beforeend", `<span class="fix">${esc(shown)}</span>`); wrongWords.push(shown); }
    });
  } else if (E.type === "pick") {
    const items = [...card.querySelectorAll(".item")];
    if (items.some(it => !it.querySelector('[aria-pressed="true"]'))) { fb.innerHTML = `<div class="fb mid"><span>Choose an answer for each one.</span></div>`; return; }
    items.forEach(it => {
      const i = +it.dataset.i, I = E.items[i];
      const v = it.querySelector('[aria-pressed="true"]').dataset.v;
      const ok = v === I.a; if (ok) pts++; else miss.add(i);
      it.classList.add(ok ? "ok" : "no");
      it.querySelectorAll(".tgb").forEach(b => b.disabled = true);
      if (!ok) it.insertAdjacentHTML("beforeend", `<span class="why">${esc(I.why)}</span>`);
    });
  }
  scores[E.id] = pts;
  misses[E.id] = miss;
  drawTally();
  const max = maxOf(E);
  const msg = pts === max ? "Perfect!" : pts >= max * 0.6 ? "Well done!" : E.type === "cloze" ? "Look at the green words." : "Read the explanations.";
  fb.innerHTML = `<div class="fb ${pts >= max * 0.6 ? "good" : "mid"}"><strong>${msg} ${fmt(pts)} out of ${max}</strong>${E.type === "cloze" ? `<span>Green = right. Yellow = almost, check the spelling (half a point). Red = wrong. Next to it you find how to write it.</span>` : ""}${notes.map(n => `<span>${esc(n)}</span>`).join("")}</div>`;
  const go = document.getElementById("go");
  go.textContent = step === RUN.length - 1 ? "See the result" : "Next exercise";
  go.onclick = () => { step++; show(); window.scrollTo({ top: 0 }); };
  go.focus();
}

function finish() {
  const t = total();
  const words = [...new Set(wrongWords)];
  const left = RUN.filter(e => misses[e.id] && misses[e.id].size);
  const nLeft = left.reduce((a, e) => a + misses[e.id].size, 0);
  let top;
  if (mode === "full") {
    const voto = Math.round((t / 3) * 2) / 2;
    let best = null;
    try { const prev = Number(localStorage.getItem("ver-sci-2-best") || 0); if (t > prev) localStorage.setItem("ver-sci-2-best", String(t)); best = Math.max(prev, t); } catch (e) { best = null; }
    const msg = t >= 27 ? "Excellent! You are ready for the real test." : t >= 21 ? "Well done! Study the words below and try again." : "Read the summaries and the table \"Vertebrates at a glance\" again, then try again.";
    top = `<div class="ex-head"><b>Result</b><small>30 points in all</small></div>
      <div class="big">${fmt(t)} / 30</div>
      <div class="grade">Grade: ${fmt(voto)}</div>
      <p>${msg}</p>
      ${best ? `<p class="tip">Your best: ${fmt(best)} out of 30</p>` : ""}`;
  } else {
    const m = runMax();
    top = `<div class="ex-head"><b>Redo of the wrong ones</b><small>${m} to redo</small></div>
      <div class="big">${fmt(t)} / ${m}</div>
      <p>${nLeft ? "Some are still wrong: redo only those." : "Now they are all right. Excellent!"}</p>`;
  }
  card.innerHTML = `
    <div class="end">
      ${top}
      <table class="res">${RUN.map(e => `<tr><td>${esc(e.title)}</td><td>${fmt(scores[e.id] ?? 0)} / ${maxOf(e)}</td></tr>`).join("")}</table>
      ${words.length ? `<p class="tip">Words to copy three times in your notebook:</p><div class="copy">${words.map(w => `<span>${esc(w)}</span>`).join("")}</div>` : `<p class="tip">No wrong words: perfect spelling!</p>`}
      <div class="row">
        ${nLeft ? `<button class="btn" id="redo" type="button">Redo only the wrong ones (${nLeft})</button>` : ""}
        <button class="btn ${nLeft ? "ghost" : ""}" id="again" type="button">Do the whole test again</button>
      </div>
    </div>`;
  const redo = document.getElementById("redo");
  if (redo) redo.onclick = () => {
    only = {};
    left.forEach(e => { only[e.id] = new Set(misses[e.id]); });
    RUN = left; mode = "redo"; restart();
  };
  document.getElementById("again").onclick = () => { only = {}; RUN = EX; mode = "full"; restart(); };
}

function restart() { step = 0; scores = {}; misses = {}; wrongWords = []; show(); window.scrollTo({ top: 0 }); }

show();
</script>
