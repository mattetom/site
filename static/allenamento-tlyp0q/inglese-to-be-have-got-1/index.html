<style>
/* Layout: a ruled notebook page (blue lines, red margin) like the English binder; one exercise per card */

}

    --ok: #72cf87; --ok-bg: #173826; --miss: #ff8a9a; --miss-bg: #3d1b23; --sun: #ffd166; --sun-bg: #3a3014; --bun-fur: #f4f6fc; --bun-line: #0b1222; --bun-pink: #f3aebd; --bun-cheek: #f08fa4; --bun-mouth: #e0574b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1626; --rule: #1b2740; --margin: #5a2a2a; --card: #172238; --ink: #e8eefb; --ink-soft: #a3b0cc;
  --line: #2a3a5a; --blue: #8fb3f5; --blue-bg: #1f3157; --red: #ff8a7d; --red-bg: #40201d;
  --ok: #72cf87; --ok-bg: #173826; --miss: #ff8a9a; --miss-bg: #3d1b23; --sun: #ffd166; --sun-bg: #3a3014; --bun-fur: #f4f6fc; --bun-line: #0b1222; --bun-pink: #f3aebd; --bun-cheek: #f08fa4; --bun-mouth: #e0574b; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(90deg, transparent 38px, var(--margin) 38px, var(--margin) 40px, transparent 40px),
    linear-gradient(var(--rule) 1px, transparent 1px);
  background-size: 100% 100%, 100% 34px;
  color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.5;
  min-height: 100vh; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; margin: 0;
}
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-family: var(--mono); font-weight: 500; font-size: 13px; letter-spacing: .06em; color: var(--blue); }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(32px, 8vw, 48px); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 span { color: var(--red); }
.sub { color: var(--ink-soft); margin: 4px 0 0; font-size: 16px; max-width: 58ch; }

.tally { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.step { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--line); display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: 13px; color: var(--ink-soft); background: var(--card); }
.step.done { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.step.now { border-color: var(--red); background: var(--red-bg); color: var(--ink); }
.pts { margin-left: auto; font-family: var(--mono); font-weight: 700; font-size: 17px; color: var(--blue); font-variant-numeric: tabular-nums; }

.card { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ex-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.ex-head b { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--blue); }
.ex-head small { color: var(--ink-soft); font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.how { margin: 0; color: var(--ink-soft); font-size: 15px; }

.bank { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; border: 2px dashed var(--blue); border-radius: 14px; }
.chip { font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--blue-bg); color: var(--ink); }
.story { margin: 0; padding: 12px 14px; border-left: 4px solid var(--blue); background: var(--blue-bg); border-radius: 0 12px 12px 0; font-size: 17px; }

.sent { margin: 0; line-height: 2.3; font-size: 18px; }
.sent .was { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--red); }
.fill { display: inline-flex; align-items: baseline; gap: 1px; white-space: nowrap; }
.fill .pre { font-weight: 700; color: var(--red); }
.fill input {

}
.fill.w input { width: 9.5em; }
.fill input:focus { outline: none; border-bottom-color: var(--red); background: var(--red-bg); }
.fill.ok input { border-bottom-color: var(--ok); background: var(--ok-bg); }

.fix { font-weight: 700; color: var(--ok); margin-left: 4px; font-size: 16px; }

.items { display: flex; flex-direction: column; gap: 10px; }
.item { border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }

.item.no { border-color: var(--miss); background: var(--miss-bg); }
.item p { margin: 0; font-size: 18px; }
.item .tg { display: flex; gap: 8px; flex-wrap: wrap; }

.tgb[aria-pressed="true"] { border-color: var(--blue); background: var(--blue); color: var(--card); }

button:focus-visible, input:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { font: inherit; font-weight: 700; font-size: 17px; cursor: pointer; padding: 11px 18px; border-radius: 14px; border: 2px solid var(--blue); background: var(--blue); color: var(--card); }
.btn.ghost { background: transparent; color: var(--blue); }
.fill.given { font-weight: 700; color: var(--ok); }
.fb { border-radius: 14px; padding: 12px 14px; font-size: 16px; display: flex; flex-direction: column; gap: 4px; }
.fb.good { background: var(--ok-bg); border: 2px solid var(--ok); }
.fb.mid { background: var(--sun-bg); border: 2px solid var(--sun); }
.fb strong { font-size: 18px; }

.end { display: flex; flex-direction: column; gap: 12px; }
.big { font-family: var(--display); font-weight: 800; font-size: 64px; line-height: 1; color: var(--blue); font-variant-numeric: tabular-nums; }
.grade { font-family: var(--display); font-size: 24px; font-weight: 800; }
table.res { border-collapse: collapse; width: 100%; font-size: 16px; }
table.res td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.res td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; font-family: var(--mono); }
.copy { display: flex; flex-wrap: wrap; gap: 8px; }
.copy span { font-weight: 700; padding: 4px 10px; border-radius: 10px; background: var(--red-bg); border: 2px solid var(--red); }
.tip { margin: 0; color: var(--ink-soft); font-size: 15px; }
.hero { display: flex; flex-direction: row; align-items: center; gap: 14px; }
.hero > div { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.bunny { width: 92px; height: 92px; flex: none; }
.bunny.s { width: 54px; height: 54px; }
.fbrow { display: flex; gap: 12px; align-items: center; }
.fbrow > div { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.say { font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--blue); }
.endtop { display: flex; gap: 16px; align-items: center; }
.endtop > div { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 420px) { .bunny { width: 70px; height: 70px; } .bunny.s { width: 44px; height: 44px; } }
@media (prefers-reduced-motion: no-preference) {
  .hop { animation: hop .6s ease-out 2; transform-origin: 50% 100%; }
  @keyframes hop { 0%, 100% { transform: none; } 35% { transform: translateY(-10px) scaleY(1.04); } 60% { transform: translateY(0) scaleY(.96); } }
}
@media (prefers-reduced-motion: no-preference) {

  @keyframes grow { from { transform: scale(.985); } to { transform: none; } }
}

<div class="wrap">
  <header class="hero">
    <span id="hb"></span>
    <div>
      <div class="eyebrow">ENGLISH &middot; GRADE 4 &middot; PRESENT SIMPLE</div>
      <h1>To be and <span>have got</span></h1>
      <p class="sub">Hi Margherita! Seven exercises, 30 points. Write carefully: spelling and apostrophes count!</p>
    </div>
  </header>
  <div class="tally"><div class="steps" id="steps"></div><div class="pts" id="pts"></div></div>
  <main class="card" id="card" aria-live="polite"></main>
</div>

<script>
// Each blank: a = accepted answers (lowercase), show = how to write it, pre = first letter shown.
// copy: true = wrong words go in the "copy three times" list (spelling exercises only).
const EX = [
  { id: "e1", type: "cloze", title: "1. Am, is or are?", max: 5,
    how: "Write am, is or are.", chips: ["am", "is", "are"],
    tip: "My mum, my birthday, my brother = she, it, he: IS. Due o piu persone o cose = they: ARE. I: AM.",
    sents: [
      ["My mum ", { a: ["is"] }, " a nurse."],
      ["My friends ", { a: ["are"] }, " at the cinema."],
      ["I ", { a: ["am"] }, " very tired today."],
      ["My birthday ", { a: ["is"] }, " in March."],
      ["My two brothers ", { a: ["are"] }, " tall."]
    ] },
  { id: "e2", type: "cloze", title: "2. Short forms", max: 5, copy: true, wide: true,
    how: "Write the short form. Don't forget the apostrophe ( ' ).",
    tip: "L'apostrofo prende il posto delle lettere che mancano: are n-o-t = aren't, I a-m = I'm, have = 've.",
    sents: [
      ["you are = ", { a: ["you're"], show: "you're" }],
      ["it is not = ", { a: ["it isn't", "it's not"], show: "it isn't" }],
      ["I am not = ", { a: ["i'm not"], show: "I'm not" }],
      ["they have got = ", { a: ["they've got"], show: "they've got" }],
      ["he has got = ", { a: ["he's got"], show: "he's got" }]
    ] },
  { id: "e3", type: "pick", title: "3. To be or have got?", max: 4,
    how: "Choose the correct answer.",
    items: [
      { q: "My dog ... four years old.", opts: ["is", "has got"], a: "is",
        why: "L'eta in inglese si dice con TO BE: My dog is four. Non si dice 'ha quattro anni'." },
      { q: "I ... two rabbits.", opts: ["am", "have got"], a: "have got",
        why: "Gli animali che hai si dicono con HAVE GOT: I have got two rabbits. 'I am two rabbits' vuol dire 'io sono due conigli'!" },
      { q: "Tom ... blue eyes.", opts: ["is", "has got"], a: "has got",
        why: "Occhi e capelli si dicono con HAVE GOT. Tom = he, quindi HAS got." },
      { q: "We ... at the park.", opts: ["are", "have got"], a: "are",
        why: "Dove sei si dice con TO BE: We are at the park." }
    ] },
  { id: "e4", type: "pick", title: "4. Read: true or false?", max: 4,
    how: "Read the text, then choose true or false.",
    story: "Hi! I'm Luca. I'm ten years old. I've got a brother, Marco. He's six. My mum is a vet and my dad is an engineer. We've got a cat, Pepe. Pepe isn't big, he's very small. Today is Sunday and we aren't at school: we're at the beach!",
    items: [
      { q: "Luca is nine years old.", opts: ["true", "false"], a: "false",
        why: "Falso: \"I'm ten years old\", Luca ha dieci anni." },
      { q: "Marco is Luca's brother.", opts: ["true", "false"], a: "true",
        why: "Vero: \"I've got a brother, Marco\"." },
      { q: "Pepe is a big cat.", opts: ["true", "false"], a: "false",
        why: "Falso: \"Pepe isn't big, he's very small\". Isn't = is not." },
      { q: "They are at school today.", opts: ["true", "false"], a: "false",
        why: "Falso: \"we aren't at school: we're at the beach\". Aren't = are not." }
    ] },
  { id: "e5", type: "cloze", title: "5. Make it right!", max: 4,
    how: "Each sentence has a mistake (crossed out). Write the correct word.",
    tip: "Guarda chi e il soggetto: the children = they (ARE), she = HAS got. L'eta con TO BE. Nelle domande il verbo va all'inizio: Are you...?",
    sents: [
      [{ was: "The children is happy." }, "The children ", { a: ["are"] }, " happy."],
      [{ was: "I have ten years old." }, "I ", { a: ["am"] }, " ten years old."],
      [{ was: "She have got a dog." }, "She ", { a: ["has"] }, " got a dog."],
      [{ was: "Is you hungry?" }, { a: ["are"], show: "Are" }, " you hungry?"]
    ] },
  { id: "e6", type: "cloze", title: "6. Questions and short answers", max: 4,
    how: "Complete the question and the short answer.",
    tip: "Nella domanda il verbo va prima: Is she...? Are you...? Nella risposta breve: Yes, I am. No, she isn't.",
    sents: [
      [{ a: ["is"], show: "Is" }, " your sister at home? No, she ", { a: ["isn't"], show: "isn't" }, "."],
      [{ a: ["are"], show: "Are" }, " you happy? Yes, I ", { a: ["am"] }, "."]
    ] },
  { id: "e7", type: "cloze", title: "7. Spelling", max: 4, copy: true, wide: true,
    how: "You have only the first letter: write the whole word.",
    sents: [
      ["My dad is an ", { pre: "e", a: ["engineer"] }, "."],
      ["I have got two ", { pre: "r", a: ["rabbits"] }, "."],
      ["Can I have a ", { pre: "c", a: ["cup"] }, " of tea?"],
      ["Look at the ", { pre: "e", a: ["example"] }, " in your notebook."]
    ] }
];

let mode = "full";    // "full" = all exercises, "redo" = only what she got wrong
let RUN = EX;         // exercises in this run
let only = {};        // redo: id -> Set of item indices to redo
let step = 0;
let scores = {};      // id -> points
let misses = {};      // id -> Set of item indices not fully right in this run
let wrongWords = [];  // correct spellings to copy
const card = document.getElementById("card");

// the rabbit from the review sheet; colours come from the theme tokens
function bunny(cls) {
  const f = "fill:var(--bun-fur);stroke:var(--bun-line);stroke-width:3";
  return `<svg class="bunny ${cls || ""}" viewBox="0 0 100 100" aria-hidden="true">
    <ellipse cx="36" cy="22" rx="8" ry="21" style="${f}" transform="rotate(-12 36 22)"/>
    <ellipse cx="36" cy="24" rx="3.5" ry="14" style="fill:var(--bun-pink)" transform="rotate(-12 36 24)"/>
    <ellipse cx="62" cy="22" rx="8" ry="21" style="${f}" transform="rotate(12 62 22)"/>
    <ellipse cx="62" cy="24" rx="3.5" ry="14" style="fill:var(--bun-pink)" transform="rotate(12 62 24)"/>
    <ellipse cx="50" cy="82" rx="27" ry="16" style="${f}"/>
    <circle cx="50" cy="57" r="22" style="${f}"/>
    <circle cx="42" cy="53" r="3.6" style="fill:var(--bun-line)"/>
    <circle cx="58" cy="53" r="3.6" style="fill:var(--bun-line)"/>
    <circle cx="43.3" cy="51.7" r="1.2" style="fill:#fff"/>
    <circle cx="59.3" cy="51.7" r="1.2" style="fill:#fff"/>
    <ellipse cx="34" cy="62" rx="5" ry="3.5" style="fill:var(--bun-cheek)"/>
    <ellipse cx="66" cy="62" rx="5" ry="3.5" style="fill:var(--bun-cheek)"/>
    <path d="M47.5 59 L52.5 59 L50 62 Z" style="fill:var(--bun-mouth)"/>
    <path d="M40 64 Q50 77 60 64 Z" style="fill:var(--bun-mouth);stroke:var(--bun-line);stroke-width:2;stroke-linejoin:round"/>
    <path d="M45 70 Q50 67.5 55 70 Q50 74 45 70 Z" style="fill:var(--bun-pink)"/>
  </svg>`;
}
document.getElementById("hb").innerHTML = bunny("");

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
// phones and tablets type a curly apostrophe: treat it like the straight one
function clean(s) { return s.trim().toLowerCase().replace(/[\u2018\u2019\u00b4`]/g, "'").replace(/\s+/g, " ").replace(/[.,;!?]+$/, ""); }
function dist(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
// 1 = right, 0.5 = one letter off (two for long words), 0 = wrong
function grade(typed, accepted) {
  const t = clean(typed);
  if (!t) return 0;
  if (accepted.includes(t)) return 1;
  if (accepted.some(a => a.length >= 4 && dist(t, a) <= (a.length >= 9 ? 2 : 1))) return 0.5;
  return 0;
}
function fmt(n) { return String(n).replace(".", ","); }
function total() { return Object.values(scores).reduce((a, b) => a + b, 0); }
function isBlank(p) { return typeof p !== "string" && !p.was; }
function blanksOf(E) { return E.sents.flat().filter(isBlank); }
function shownWord(B) { return B.show || B.a[0]; }
function redoing(E, i) { return mode !== "redo" || only[E.id].has(i); }
function maxOf(E) { return mode === "redo" ? only[E.id].size : E.max; }
function runMax() { return RUN.reduce((a, e) => a + maxOf(e), 0); }

function drawTally() {
  document.getElementById("steps").innerHTML = RUN.map((e, i) => `<span class="step ${scores[e.id] !== undefined ? "done" : ""} ${i === step ? "now" : ""}">${i + 1}</span>`).join("");
  document.getElementById("pts").textContent = mode === "redo" ? `${fmt(total())} of ${runMax()} right` : `${fmt(total())} points`;
}

function show() {
  drawTally();
  if (step >= RUN.length) return finish();
  const E = RUN[step];
  let body = "";
  if (E.chips) body += `<div class="bank">${E.chips.map(w => `<span class="chip">${esc(w)}</span>`).join("")}</div>`;
  if (E.story) body += `<p class="story">${esc(E.story)}</p>`;
  if (E.type === "cloze") {
    let k = 0;
    body += E.sents.map(s => {
      let open = false;
      const html = s.map(p => {
        if (typeof p === "string") return esc(p);
        if (p.was) return `<span class="was">${esc(p.was)}</span><br>`;
        const i = k++;
        if (!redoing(E, i)) return `<span class="fill given">${esc(shownWord(p))}</span>`;
        open = true;
        return `<span class="fill ${E.wide ? "w" : ""}" data-k="${i}"><span class="pre">${esc(p.pre || "")}</span><input id="${E.id}-${i}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="missing word"></span>`;
      }).join("");
      return open ? `<p class="sent">${html}</p>` : "";
    }).join("");
  } else if (E.type === "pick") {
    body += `<div class="items">${E.items.map((it, i) => !redoing(E, i) ? "" : `<div class="item" data-i="${i}"><p>${esc(it.q)}</p><div class="tg">${it.opts.map(v => `<button type="button" class="tgb" aria-pressed="false" data-v="${esc(v)}">${esc(v)}</button>`).join("")}</div></div>`).join("")}</div>`;
  }
  card.innerHTML = `
    <div class="ex-head"><b>${esc(E.title)}</b><small>${mode === "redo" ? `${maxOf(E)} to redo` : `${E.max} points`}</small></div>
    <p class="how">${mode === "redo" ? "Redo only the wrong ones: the green parts were already right. " : ""}${esc(E.how)}</p>
    ${body}
    <div id="fb"></div>
    <div class="row"><button class="btn" id="go" type="button">Check</button></div>`;
  wire(E);
  const first = card.querySelector("input"); if (first) first.focus();
}

function wire(E) {
  const go = document.getElementById("go");
  if (E.type === "pick") {
    card.querySelectorAll(".item").forEach(it => it.querySelectorAll(".tgb").forEach(b => b.addEventListener("click", () => {
      it.querySelectorAll(".tgb").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    })));
  }
  card.querySelectorAll("input").forEach((inp, idx, all) => inp.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); const nx = all[idx + 1]; if (nx) nx.focus(); else go.click(); }
  }));
  go.onclick = () => check(E);
}

function check(E) {
  const fb = document.getElementById("fb");
  let pts = 0;
  const miss = new Set();
  if (E.type === "cloze") {
    const blanks = blanksOf(E);
    const empty = [...card.querySelectorAll("input")].some(i => !i.value.trim());
    if (empty && !fb.dataset.warned) { fb.dataset.warned = "1"; fb.innerHTML = `<div class="fb mid"><span>Some blanks are still empty. To check anyway, press Check again.</span></div>`; return; }
    card.querySelectorAll(".fill:not(.given)").forEach(f => {
      const k = +f.dataset.k, B = blanks[k], inp = f.querySelector("input");
      // she may retype the first letter too: try both "e"+"ngineer" and "engineer"
      const cands = B.pre ? [B.pre + inp.value, inp.value] : [inp.value];
      const typed = cands.reduce((best, c) => grade(c, B.a) > grade(best, B.a) ? c : best, cands[0]);
      const g = grade(typed, B.a);
      pts += g;
      inp.disabled = true;
      f.classList.add(g === 1 ? "ok" : g === 0.5 ? "half" : "no");
      if (g < 1) { miss.add(k); f.insertAdjacentHTML("beforeend", `<span class="fix">${esc(shownWord(B))}</span>`); if (E.copy) wrongWords.push(shownWord(B)); }
    });
  } else if (E.type === "pick") {
    const items = [...card.querySelectorAll(".item")];
    if (items.some(it => !it.querySelector('[aria-pressed="true"]'))) { fb.innerHTML = `<div class="fb mid"><span>Choose an answer for every sentence.</span></div>`; return; }
    items.forEach(it => {
      const i = +it.dataset.i, I = E.items[i];
      const v = it.querySelector('[aria-pressed="true"]').dataset.v;
      const ok = v === I.a; if (ok) pts++; else miss.add(i);
      it.classList.add(ok ? "ok" : "no");
      it.querySelectorAll(".tgb").forEach(b => b.disabled = true);
      if (!ok) it.insertAdjacentHTML("beforeend", `<span class="why">${esc(I.why)}</span>`);
    });
  }
  scores[E.id] = pts;
  misses[E.id] = miss;
  drawTally();
  const max = maxOf(E);
  const msg = pts === max ? "Perfect!" : pts >= max * 0.6 ? "Well done!" : E.type === "cloze" ? "Look at the green words." : "Read the explanations.";
  const tip = miss.size && E.tip ? `<span>${esc(E.tip)}</span>` : "";
  const say = pts === max ? "Hop hop! All right!" : pts >= max * 0.6 ? "Good job, keep going!" : "Don't worry, read and try again!";
  fb.innerHTML = `<div class="fb ${pts >= max * 0.6 ? "good" : "mid"}"><div class="fbrow">${bunny("s" + (pts === max ? " hop" : ""))}<div><span class="say">${say}</span><strong>${msg} ${fmt(pts)} of ${max}</strong>${E.type === "cloze" ? `<span>Green = right. Yellow = almost, check the spelling (half a point). Red = wrong. Next to it you see how to write it.</span>` : ""}${tip}</div></div></div>`;
  const go = document.getElementById("go");
  go.textContent = step === RUN.length - 1 ? "See the result" : "Next exercise";
  go.onclick = () => { step++; show(); window.scrollTo({ top: 0 }); };
  go.focus();
}

function finish() {
  const t = total();
  const words = [...new Set(wrongWords)];
  const left = RUN.filter(e => misses[e.id] && misses[e.id].size);
  const nLeft = left.reduce((a, e) => a + misses[e.id].size, 0);
  let top;
  if (mode === "full") {
    const voto = Math.round((t / 3) * 2) / 2;
    let best = null;
    try { const prev = Number(localStorage.getItem("eng-1-best") || 0); if (t > prev) localStorage.setItem("eng-1-best", String(t)); best = Math.max(prev, t); } catch (e) { best = null; }
    const msg = t >= 27 ? "Excellent! You know to be and have got." : t >= 21 ? "Good! Look at the words below and try again." : "Read the review sheet again, then try again.";
    top = `<div class="ex-head"><b>Result</b><small>30 points in all</small></div>
      <div class="endtop">${bunny(t >= 27 ? "hop" : "")}<div><div class="big">${fmt(t)} / 30</div>
      <div class="grade">Voto: ${fmt(voto)}</div></div></div>
      <p>${msg}</p>
      ${best ? `<p class="tip">Your record: ${fmt(best)} of 30</p>` : ""}`;
  } else {
    const m = runMax();
    top = `<div class="ex-head"><b>Wrong ones again</b><small>${m} to redo</small></div>
      <div class="endtop">${bunny(nLeft ? "" : "hop")}<div class="big">${fmt(t)} / ${m}</div></div>
      <p>${nLeft ? "Some are still wrong: redo only those." : "Now they are all right. Well done!"}</p>`;
  }
  card.innerHTML = `
    <div class="end">
      ${top}
      <table class="res">${RUN.map(e => `<tr><td>${esc(e.title)}</td><td>${fmt(scores[e.id] ?? 0)} / ${maxOf(e)}</td></tr>`).join("")}</table>
      ${words.length ? `<p class="tip">Copy these three times in your notebook:</p><div class="copy">${words.map(w => `<span>${esc(w)}</span>`).join("")}</div>` : `<p class="tip">No spelling mistakes: perfect!</p>`}
      <div class="row">
        ${nLeft ? `<button class="btn" id="redo" type="button">Redo only the wrong ones (${nLeft})</button>` : ""}
        <button class="btn ${nLeft ? "ghost" : ""}" id="again" type="button">Do it all again</button>
      </div>
    </div>`;
  const redo = document.getElementById("redo");
  if (redo) redo.onclick = () => {
    only = {};
    left.forEach(e => { only[e.id] = new Set(misses[e.id]); });
    RUN = left; mode = "redo"; restart();
  };
  document.getElementById("again").onclick = () => { only = {}; RUN = EX; mode = "full"; restart(); };
}

function restart() { step = 0; scores = {}; misses = {}; wrongWords = []; show(); window.scrollTo({ top: 0 }); }

show();
</script>
