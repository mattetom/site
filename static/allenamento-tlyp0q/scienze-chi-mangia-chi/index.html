<body>
<a id="allen-back" href="../" style="position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;z-index:50;font:600 15px/1 system-ui,sans-serif;background:#fff;color:#2f5fb3;border:2px solid #d3dbeb;border-radius:999px;padding:9px 14px;text-decoration:none;box-shadow:0 2px 6px rgba(0,0,0,.12)">&larr; All exercises</a>
<title>Who eats whom?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a meadow page; one question card at a time; progress is a row of "links" (chain rings) that turn green or red */
:root {
  --meadow: #eef5e4;
  --meadow-deep: #dcebc8;
  --card: #fffdf7;
  --ink: #23331c;
  --ink-soft: #5b6b50;
  --line: #d3dfc3;
  --leaf: #3f8f3a;
  --leaf-bg: #e2f2dc;
  --sun: #e9a400;
  --sun-bg: #fff2cc;
  --berry: #b8324f;
  --berry-bg: #fbe4ea;
  --soil: #8a5a3b;
  --soil-bg: #f3e6dc;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --meadow: #121b10; --meadow-deep: #1b2817; --card: #1d2a19; --ink: #eef4e6; --ink-soft: #aab99c;
    --line: #2f4228; --leaf: #7fd27a; --leaf-bg: #1f3a1c; --sun: #ffc640; --sun-bg: #3a3014;
    --berry: #ff8fa6; --berry-bg: #3c1b24; --soil: #d9a27c; --soil-bg: #3a2a1f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --meadow: #121b10; --meadow-deep: #1b2817; --card: #1d2a19; --ink: #eef4e6; --ink-soft: #aab99c;
  --line: #2f4228; --leaf: #7fd27a; --leaf-bg: #1f3a1c; --sun: #ffc640; --sun-bg: #3a3014;
  --berry: #ff8fa6; --berry-bg: #3c1b24; --soil: #d9a27c; --soil-bg: #3a2a1f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: linear-gradient(180deg, var(--meadow) 0%, var(--meadow) 70%, var(--meadow-deep) 100%);
  background-color: var(--meadow);
  color: var(--ink);
  font-family: var(--body);
  font-size: 19px;
  line-height: 1.5;
  min-height: 100vh;
  padding-inline: 16px;
  padding-block: 20px 40px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-family: var(--display); font-weight: 500; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--soil); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(38px, 9vw, 56px); line-height: 1; margin: 0; text-wrap: balance; }
h1 .a { color: var(--leaf); }
h1 .b { color: var(--sun); }
.sub { color: var(--ink-soft); margin: 4px 0 0; font-size: 16px; max-width: 58ch; }

.links { display: flex; flex-wrap: wrap; gap: 3px; }
.ring { width: 16px; height: 11px; border-radius: 6px; border: 3px solid var(--line); }
.ring.ok { border-color: var(--leaf); }
.ring.no { border-color: var(--berry); }
.ring.now { background: var(--sun); border-color: var(--sun); }

.card { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 22px 20px; display: flex; flex-direction: column; gap: 16px; }
.round { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.round b { font-family: var(--display); font-weight: 700; font-size: 21px; color: var(--leaf); }
.round small { color: var(--ink-soft); font-size: 14px; font-variant-numeric: tabular-nums; }
.how { margin: 0; color: var(--ink-soft); font-size: 15px; }
.q { margin: 0; font-size: 23px; font-weight: 700; line-height: 1.35; text-wrap: balance; }
.q small { display: block; font-weight: 400; font-size: 16px; color: var(--ink-soft); }

.opts { display: grid; grid-template-columns: 1fr; gap: 10px; }
.opts.two { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.opt {
  font: inherit; font-size: 18px; text-align: left; cursor: pointer; padding: 12px 14px; border-radius: 14px;
  border: 2px solid var(--line); background: var(--card); color: var(--ink); display: flex; gap: 10px; align-items: center;
}
.opt .k { font-family: var(--display); font-weight: 700; color: var(--leaf); min-width: 1.1em; }
.opt:hover:not(:disabled) { border-color: var(--leaf); background: var(--leaf-bg); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--leaf); background: var(--leaf-bg); }
.opt.wrong { border-color: var(--berry); background: var(--berry-bg); }
button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

/* chain builder */
.chain { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chain .slot, .chain .sunbox {
  min-width: 0; flex: 1 1 110px; min-height: 64px; border-radius: 14px; border: 2px dashed var(--line);
  display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 6px 8px; text-align: center;
}
.chain .sunbox { border-style: solid; border-color: var(--sun); background: var(--sun-bg); }
.chain .slot.filled { border-style: solid; border-color: var(--leaf); background: var(--leaf-bg); }
.chain .slot.bad { border-color: var(--berry); background: var(--berry-bg); }
.chain .arrow { font-family: var(--display); font-weight: 700; color: var(--soil); font-size: 22px; }
.chain b { font-size: 17px; }
.chain span.it { font-size: 13px; color: var(--ink-soft); }
.chain .role { font-size: 12px; color: var(--soil); text-transform: uppercase; letter-spacing: .05em; }
.deck { display: flex; flex-wrap: wrap; gap: 10px; }
.deck .opt { flex: 1 1 140px; flex-direction: column; align-items: flex-start; gap: 0; }
.deck .opt span.it { font-size: 14px; color: var(--ink-soft); }
.deck .opt.used { visibility: hidden; }

.btn { font: inherit; font-weight: 700; font-size: 17px; cursor: pointer; padding: 11px 18px; border-radius: 14px; border: 2px solid var(--leaf); background: var(--leaf); color: var(--card); }
.btn.ghost { background: transparent; color: var(--leaf); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.next { display: flex; justify-content: flex-end; }

.fb { border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 16px; }
.fb.ok { background: var(--leaf-bg); border: 2px solid var(--leaf); }
.fb.no { background: var(--berry-bg); border: 2px solid var(--berry); }
.fb strong { font-size: 17px; }
.fb .src { font-size: 14px; color: var(--ink-soft); }

.end { display: flex; flex-direction: column; gap: 12px; }
.big { font-family: var(--display); font-weight: 700; font-size: 62px; line-height: 1; color: var(--leaf); font-variant-numeric: tabular-nums; }
.miss { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 16px; }
.miss b { display: block; }
.tip { margin: 0; color: var(--ink-soft); font-size: 15px; }
@media (prefers-reduced-motion: no-preference) {
  .card { animation: grow .25s ease-out; }
  @keyframes grow { from { transform: scale(.985); } to { transform: none; } }
}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Science · Grade 4 · Ecosystems</div>
    <h1>Who <span class="a">eats</span> <span class="b">whom?</span></h1>
    <p class="sub">Ecology, ecosystems and the food chain. Questions and explanations in English, like at school.</p>
  </header>
  <div class="links" id="links" aria-label="Progress"></div>
  <main class="card" id="card" aria-live="polite"></main>
</div>

<script>
const ROUNDS = {
  live:  { name: "Round 1: Living or non-living?", how: "Living things are born, grow, feed and die. Non-living things do not." },
  role:  { name: "Round 2: What is its role?", how: "Producer, primary consumer, secondary consumer or decomposer?" },
  chain: { name: "Round 3: Build the food chain", how: "Tap the cards in the right order. The arrows point to the one that eats." },
  words: { name: "Round 4: Words", how: "Choose the right answer." },
  tf:    { name: "Round 5: True or False", how: "Is the sentence true or false?" }
};
const LIVE = ["Living", "Non-living"];
const ROLES = ["Producer", "Primary consumer", "Secondary consumer", "Decomposer"];
const TF = ["True", "False"];

const QS = [
  { r: "live", q: "a mushroom", a: "Living", why: "Fungi are living things, but they are not plants and not animals.", src: "Notebook, Ecology" },
  { r: "live", q: "a rock", a: "Non-living", why: "A rock is not born, does not grow and does not feed. It is non-living.", src: "Notebook, Ecology" },
  { r: "live", q: "bacteria", a: "Living", why: "Bacteria are microorganisms: very tiny living things. You can only see them with a microscope.", src: "Notebook, Ecology" },
  { r: "live", q: "sunlight", a: "Non-living", why: "Light is non-living, but without it plants cannot do photosynthesis.", src: "Notebook, Ecology" },
  { r: "live", q: "snow", a: "Non-living", why: "Snow is frozen water. It is non-living, even if it melts and changes.", src: "Worksheet Explore an ecosystem" },
  { r: "live", q: "an earthworm", a: "Living", why: "An earthworm is an animal. It helps the decomposers.", src: "Worksheet The Food Chain" },
  { r: "live", q: "the soil", a: "Non-living", why: "Soil is non-living, but many living things live in it.", src: "Notebook, Ecology" },

  { r: "role", q: "grass", a: "Producer", why: "Grass is a plant. It makes its own food through photosynthesis.", src: "Worksheet The Food Chain" },
  { r: "role", q: "a rabbit that eats grass", a: "Primary consumer", why: "It eats producers, so it is a primary consumer. It is a herbivore.", src: "Worksheet The Food Chain" },
  { r: "role", q: "a fox that eats rabbits", a: "Secondary consumer", why: "It eats a primary consumer, so it is a secondary consumer.", src: "Worksheet The Food Chain" },
  { r: "role", q: "fungi and bacteria that break down dead leaves", a: "Decomposer", why: "Decomposers return nutrients to the soil.", src: "Worksheet The Food Chain" },
  { r: "role", q: "an oak tree", a: "Producer", why: "Trees are plants too. They do photosynthesis, so they are producers.", src: "Worksheet The Food Chain" },
  { r: "role", q: "a caterpillar that eats leaves", a: "Primary consumer", why: "Leaves come from a plant, so the caterpillar is a primary consumer.", src: "Worksheet The Food Chain" },
  { r: "role", q: "an eagle that eats marmots", a: "Secondary consumer", why: "The marmot eats grass (primary). The eagle eats the marmot (secondary).", src: "Worksheet Explore an ecosystem" },

  { r: "chain", place: "Meadow", cards: [["grass", ""], ["grasshopper", ""], ["frog", ""]], why: "Grass makes food with sunlight. The grasshopper eats the grass. The frog eats the grasshopper.", src: "Worksheet The Food Chain" },
  { r: "chain", place: "Forest", cards: [["leaves", ""], ["caterpillar", ""], ["robin", ""]], why: "The leaves are the producer. The caterpillar eats them. The robin eats the caterpillar.", src: "Worksheet The Food Chain" },
  { r: "chain", place: "Sea", cards: [["tiny algae", ""], ["krill", ""], ["whale", ""]], why: "The algae do photosynthesis. The krill (tiny shrimps) eat them. The whale eats the krill.", src: "Worksheet The Food Chain" },
  { r: "chain", place: "Mountain", cards: [["grass", ""], ["marmot", ""], ["eagle", ""]], why: "The marmot eats grass and meadow flowers. Its real hunter is the golden eagle.", src: "Worksheet Explore an ecosystem" },

  { r: "words", q: "Ecology is the science that studies...", o: ["only animals", "living organisms, their environment and the relationships between them", "rocks and volcanoes"], a: "living organisms, their environment and the relationships between them", why: "This is the definition in your notebook: living things, environment and relationships.", src: "Notebook, Ecology" },
  { r: "words", q: "In Greek, oikos means...", o: ["home or environment", "study", "a group of connected parts"], a: "home or environment", why: "Oikos = home, environment. Logos = study. Systema = a group of connected parts.", src: "Notebook, Ecology" },
  { r: "words", q: "An ecologist is...", o: ["a scientist who studies ecology", "an animal that eats plants", "a type of ecosystem"], a: "a scientist who studies ecology", why: "An ecologist is the scientist who studies ecology.", src: "Notebook, Ecology" },
  { r: "words", q: "An ecosystem is made up of...", o: ["only plants and animals", "living things, non-living things and their relationships", "only water and soil"], a: "living things, non-living things and their relationships", why: "The three parts: living things, non-living things and relationships.", src: "Notebook, Ecology" },
  { r: "words", q: "Plants make their own food through...", o: ["photosynthesis", "decomposition", "hunting"], a: "photosynthesis", why: "Photosynthesis: plants use energy from sunlight.", src: "Worksheet The Food Chain" },
  { r: "words", q: "An omnivore eats...", o: ["only plants", "only meat", "plants and meat"], a: "plants and meat", why: "Omnivore = eats everything. Herbivore = only plants. Carnivore = meat.", src: "Worksheet The Food Chain" },
  { r: "words", q: "Which food chain is written correctly?", o: ["grass → rabbit → fox", "fox → rabbit → grass", "rabbit → grass → fox"], a: "grass → rabbit → fox", why: "The arrows point to the one that eats, so to the one that gets the energy.", src: "Worksheet The Food Chain" },

  { r: "tf", q: "The arrows in a food chain point towards the organism that receives the energy.", a: "True", why: "These are the words on the worksheet: the arrow points to the one that eats.", src: "Worksheet Explore an ecosystem" },
  { r: "tf", q: "Primary consumers eat secondary consumers.", a: "False", why: "It is the other way round: secondary consumers eat primary consumers. Primary consumers eat plants.", src: "Worksheet The Food Chain" },
  { r: "tf", q: "Decomposers return nutrients to the soil.", a: "True", why: "Fungi and bacteria break down dead things and return nutrients to the soil.", src: "Worksheet The Food Chain" },
  { r: "tf", q: "Earthworms and some insects help the decomposers.", a: "True", why: "The worksheet says it: earthworms and some insects help decomposition.", src: "Worksheet The Food Chain" },
  { r: "tf", q: "Primary consumers are generally carnivores.", a: "False", why: "Primary consumers are usually herbivores: they eat plants.", src: "Worksheet The Food Chain" },
  { r: "tf", q: "A forest, a pond and a meadow are examples of ecosystems.", a: "True", why: "These are the examples in your notebook.", src: "Notebook, Ecosystem" }
];

let order = QS.map((_, i) => i);
let pos = 0;
let results = {};
let picked = [];
let shuffled = [];
const card = document.getElementById("card");
const linksEl = document.getElementById("links");

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } if (b.every((x, i) => x === a[i])) b.reverse(); return b; }
const ROLE_LABEL = ["Producer", "Primary consumer", "Secondary consumer"];

function drawLinks() {
  linksEl.innerHTML = order.map((qi, i) => {
    const st = results[qi] === true ? "ok" : results[qi] === false ? "no" : "";
    return `<span class="ring ${st} ${i === pos ? "now" : ""}"></span>`;
  }).join("");
}

function show() {
  drawLinks();
  if (pos >= order.length) return finish();
  const qi = order[pos], Q = QS[qi], R = ROUNDS[Q.r];
  let qtext = "", body = "";
  if (Q.r === "chain") {
    picked = [];
    shuffled = shuffle(Q.cards.map((_, i) => i));
    qtext = `${esc(Q.place)}: build the food chain.`;
    body = `<div class="chain" id="chain"></div><div class="deck" id="deck"></div>
      <div class="row"><button class="btn" id="check" disabled>Check</button><button class="btn ghost" id="undo">Remove the last one</button></div>`;
  } else {
    const opts = Q.r === "live" ? LIVE : Q.r === "role" ? ROLES : Q.r === "tf" ? TF : Q.o;
    qtext = Q.it ? `${esc(Q.q)}<small>${esc(Q.it)}</small>` : esc(Q.q);
    const two = opts.length <= 4 && opts.every(o => o.length < 22);
    body = `<div class="opts ${two ? "two" : ""}">${opts.map((o, i) => `<button class="opt" data-v="${esc(o)}"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  }
  card.innerHTML = `
    <div class="round"><b>${R.name}</b><small>${pos + 1} / ${order.length}</small></div>
    <p class="how">${R.how}</p>
    <p class="q">${qtext}</p>
    ${body}
    <div id="fb"></div>
    <div class="next"><button class="btn" id="nx" hidden>Next</button></div>`;
  if (Q.r === "chain") drawChain(Q);
  card.querySelectorAll(".opts .opt").forEach(b => b.addEventListener("click", () => answer(b.dataset.v === answerOf(Q), b)));
  document.getElementById("nx").addEventListener("click", () => { pos++; show(); window.scrollTo({ top: 0 }); });
}

function answerOf(Q) { return Q.a; }

function drawChain(Q, checked) {
  const chain = document.getElementById("chain"), deck = document.getElementById("deck");
  let html = `<div class="sunbox"><b>sunlight</b></div>`;
  for (let i = 0; i < Q.cards.length; i++) {
    const c = picked[i] !== undefined ? Q.cards[picked[i]] : null;
    const bad = checked && picked[i] !== i;
    html += `<span class="arrow" aria-hidden="true">→</span><div class="slot ${c ? "filled" : ""} ${bad ? "bad" : ""}">${c ? `<b>${esc(c[0])}</b>` : ""}${checked ? `<span class="role">${ROLE_LABEL[i]}</span>` : ""}</div>`;
  }
  chain.innerHTML = html;
  if (checked) { deck.innerHTML = ""; return; }
  deck.innerHTML = shuffled.map(ci => `<button class="opt ${picked.includes(ci) ? "used" : ""}" data-c="${ci}"><b>${esc(Q.cards[ci][0])}</b></button>`).join("");
  deck.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => { picked.push(+b.dataset.c); drawChain(Q); }));
  const check = document.getElementById("check"), undo = document.getElementById("undo");
  check.disabled = picked.length < Q.cards.length;
  check.onclick = () => {
    const ok = picked.every((ci, i) => ci === i);
    check.hidden = true; undo.hidden = true;
    drawChain(Q, true);
    answer(ok, null);
  };
  undo.onclick = () => { picked.pop(); drawChain(Q); };
}

function answer(ok, btn) {
  const qi = order[pos], Q = QS[qi];
  results[qi] = ok;
  card.querySelectorAll(".opts .opt").forEach(b => { b.disabled = true; if (b.dataset.v === Q.a) b.classList.add("right"); });
  if (btn && !ok) btn.classList.add("wrong");
  const right = Q.r === "chain" ? "sunlight → " + Q.cards.map(c => c[0]).join(" → ") : Q.a;
  document.getElementById("fb").innerHTML = ok
    ? `<div class="fb ok"><strong>Right!</strong><span>${esc(Q.why)}</span><span class="src">${esc(Q.src)}</span></div>`
    : `<div class="fb no"><strong>The right answer is: ${esc(right)}</strong><span>${esc(Q.why)}</span><span class="src">Read again: ${esc(Q.src)}</span></div>`;
  const nx = document.getElementById("nx");
  nx.hidden = false;
  nx.textContent = pos === order.length - 1 ? "See the result" : "Next";
  nx.focus();
  drawLinks();
}

function finish() {
  const good = order.filter(qi => results[qi] === true).length;
  const missed = order.filter(qi => results[qi] === false);
  let best = null;
  try {
    const prev = Number(localStorage.getItem("cmc-best") || 0);
    if (order.length === QS.length && good > prev) localStorage.setItem("cmc-best", String(good));
    best = Math.max(prev, order.length === QS.length ? good : 0) || null;
  } catch (e) { best = null; }
  const msg = good === order.length ? "Perfect chain! You understood everything."
    : good >= order.length * 0.8 ? "Very good! Just review these ones."
    : "Good start! Read the worksheets again and try again.";
  card.innerHTML = `
    <div class="round"><b>Result</b><small>${order.length} questions</small></div>
    <div class="end">
      <div class="big">${good} / ${order.length}</div>
      <p>${msg}</p>
      ${best ? `<p class="tip">Your best on the full game: ${best} out of ${QS.length}</p>` : ""}
      ${missed.length ? `<ul class="miss">${missed.map(qi => { const Q = QS[qi]; const qt = Q.r === "chain" ? Q.place : Q.q; const r = Q.r === "chain" ? "sunlight → " + Q.cards.map(c => c[0]).join(" → ") : Q.a; return `<li><b>${esc(qt)}</b>Answer: ${esc(r)}</li>`; }).join("")}</ul>` : ""}
      <div class="row">
        ${missed.length ? `<button class="btn" id="again-miss">Redo the wrong ones</button>` : ""}
        <button class="btn ghost" id="again-all">Start again</button>
      </div>
      <p class="tip">Remember: the arrow points to the one that eats. Grass → rabbit → fox.</p>
    </div>`;
  const am = document.getElementById("again-miss");
  if (am) am.addEventListener("click", () => { order = missed.slice(); missed.forEach(qi => delete results[qi]); pos = 0; show(); });
  document.getElementById("again-all").addEventListener("click", () => { order = QS.map((_, i) => i); results = {}; pos = 0; show(); });
}

function start(data) {
  if (data && Array.isArray(data.order)) { order = data.order; pos = data.pos || 0; results = data.results || {}; }
  show();
}
window.claude?.hot?.snapshot?.(() => ({ order, pos, results }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

<script src="../app.js"></script>
<script src="../track.js"></script>
<script>document.getElementById("allen-back").href = "../" + APP.carry();</script>
</body>
</html>
