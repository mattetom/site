<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Calendario dell'Avvento</title>
<!-- Family advent calendar (not linked anywhere). The page is an empty shell: story and puzzles
     come from /api/avvento (netlify/functions/avvento.mjs) only with the key in the link hash. -->
<style>
  :root {
    --night: #14213d; --night2: #1d2d50; --snow: #f7f9fc; --ink: #1f2430; --muted: #6b7280;
    --card: #fffdf8; --line: #e8e2d4; --red: #c8102e; --red-soft: #fde7ea; --green: #1f7a4d;
    --green-soft: #e3f4ea; --gold: #f2b632; --gold-soft: #fff4d6; --blue: #2f5fb3; --blue-soft: #e5edfb;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--snow);
    background: radial-gradient(ellipse at top, var(--night2), var(--night) 70%) fixed, var(--night);
    font: 18px/1.5 ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .snow { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .snow i {
    position: absolute; top: -10px; width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,.85); animation: fall linear infinite;
  }
  @keyframes fall { to { transform: translate3d(30px, 105vh, 0); } }
  @media (prefers-reduced-motion: reduce) { .snow { display: none; } }
  main { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 18px 16px 60px; }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 6px 0 2px; text-align: center; }
  .sub { text-align: center; color: #c9d3ea; margin: 0 0 16px; font-size: .95rem; }
  .badge {
    display: inline-block; background: var(--gold); color: #3a2a00; font-weight: 700;
    border-radius: 99px; padding: 2px 12px; font-size: .9rem;
  }
  .top { text-align: center; margin-bottom: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .btn {
    appearance: none; border: 0; border-radius: 14px; padding: 12px 18px; font: inherit; font-weight: 700;
    background: var(--red); color: #fff; cursor: pointer; touch-action: manipulation;
  }
  .btn.ghost { background: rgba(255,255,255,.12); color: var(--snow); }
  .btn.light { background: var(--blue-soft); color: var(--blue); }
  .btn.green { background: var(--green); }
  .btn:disabled { opacity: .5; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(6, 1fr); } }
  .door {
    position: relative; aspect-ratio: 1; border-radius: 16px; border: 2px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.06); color: var(--snow); font: inherit; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px;
  }
  .door .n { font-size: 1.7rem; font-weight: 800; line-height: 1; }
  .door .s { font-size: .7rem; color: #c9d3ea; margin-top: 4px; }
  .door .ico { position: absolute; top: 4px; right: 6px; font-size: .9rem; }
  .door.locked { opacity: .45; cursor: default; }
  .door.open { background: var(--red); border-color: #ff8a9b; box-shadow: 0 0 18px rgba(255,80,100,.5); }
  .door.done { background: var(--green); border-color: #7fd8a9; }
  .door.today { outline: 3px solid var(--gold); outline-offset: 2px; }
  .card {
    background: var(--card); color: var(--ink); border-radius: 18px; padding: 18px; margin: 0 0 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,.25);
  }
  .case { color: var(--red); font-weight: 700; font-size: .85rem; text-transform: uppercase; letter-spacing: .03em; }
  .card h2 { margin: 2px 0 10px; font-size: 1.35rem; line-height: 1.25; }
  .card p { margin: 0 0 10px; }
  .q { font-weight: 700; margin-bottom: 8px; }
  .note { background: var(--blue-soft); color: #22427d; border-radius: 10px; padding: 8px 12px; font-size: .92rem; margin: 0 0 10px; }
  .clues { margin: 0 0 12px; padding-left: 20px; }
  .clues li { margin: 4px 0; }
  input[type=text], select {
    font: inherit; width: 100%; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line);
    background: #fff; color: var(--ink);
  }
  input[type=text]:focus, select:focus { outline: none; border-color: var(--blue); }
  .row { display: flex; gap: 10px; align-items: center; margin: 0 0 10px; flex-wrap: wrap; }
  .row label { min-width: 150px; font-weight: 600; }
  .row select { flex: 1; min-width: 160px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .msg { margin-top: 10px; font-weight: 700; }
  .msg.ok { color: var(--green); }
  .msg.no { color: var(--red); }
  .hint { background: var(--gold-soft); border-radius: 10px; padding: 8px 12px; margin-top: 8px; font-size: .95rem; }
  .choices { display: flex; flex-direction: column; gap: 8px; }
  .choices .btn { text-align: left; background: var(--blue-soft); color: var(--ink); font-weight: 600; }
  .choices .btn.wrong { background: var(--red-soft); color: var(--red); }
  .pieces, .line { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; }
  .line { border: 2px dashed var(--line); border-radius: 12px; padding: 8px; margin-bottom: 10px; background: #fff; }
  .piece {
    border: 0; border-radius: 10px; padding: 8px 12px; font: inherit; font-weight: 800; letter-spacing: .02em;
    background: var(--gold); color: #3a2a00; cursor: pointer;
  }
  .line .piece { background: var(--green-soft); color: var(--green); }
  .word {
    text-align: center; background: var(--gold-soft); border: 2px dashed var(--gold); border-radius: 14px;
    padding: 12px; margin: 12px 0 0;
  }
  .word b { display: block; font-size: 1.5rem; letter-spacing: .06em; color: #7a5300; }
  .hunt { text-align: center; background: var(--green-soft); color: var(--green); border-radius: 14px; padding: 14px; margin-top: 12px; }
  .hunt .big { font-size: 1.3rem; font-weight: 800; display: block; margin-bottom: 8px; }
  .solved-mark { color: var(--green); font-weight: 700; }
  .notebook h3 { margin: 12px 0 4px; font-size: 1rem; color: var(--red); }
  .notebook .w { display: inline-block; background: var(--gold-soft); color: #7a5300; font-weight: 800; border-radius: 8px; padding: 2px 8px; margin: 2px; }
  .preview { background: var(--gold); color: #3a2a00; border-radius: 12px; padding: 8px 12px; margin-bottom: 14px; font-size: .9rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .preview input { width: auto; padding: 4px 8px; font-size: .9rem; }
  .center { text-align: center; }
  .big-emoji { font-size: 3rem; line-height: 1; }
</style>
</head>
<body>
<div class="snow" id="snow" aria-hidden="true"></div>
<main>
  <div id="preview" class="preview" hidden>
    <b>Anteprima genitore</b> · data finta:
    <input type="date" id="previewDate"> <button class="btn ghost" id="previewGo" style="padding:4px 10px;color:#3a2a00">Vai</button>
    <span>(le tue prove non vengono registrate)</span>
  </div>
  <h1 id="title">Calendario dell'Avvento</h1>
  <p class="sub" id="sub">Caricamento…</p>
  <div id="view"></div>
</main>
<script>
(function () {
  'use strict';
  var LS_KEY = 'avvento-k', LS_STATE = 'avvento-stato';
  var key = null;
  var where = location.hash + '&' + location.search;
  try { where = decodeURIComponent(decodeURIComponent(where)); } catch (e) {}
  var m = where.match(/(?:^|[#&?])k=([A-Za-z0-9_-]{16,})/);
  if (m) {
    key = m[1];
    try { localStorage.setItem(LS_KEY, key); } catch (e) {}
    try { window.history.replaceState(null, '', location.pathname + location.search.replace(/[?&]k=[^&]*/, '')); } catch (e) {}
  } else {
    try { key = localStorage.getItem(LS_KEY); } catch (e) {}
  }

  var state = { nickname: '', solved: {}, found: {}, step: {} };
  try { var saved = JSON.parse(localStorage.getItem(LS_STATE) || 'null'); if (saved) state = Object.assign(state, saved); } catch (e) {}
  function save() { try { localStorage.setItem(LS_STATE, JSON.stringify(state)); } catch (e) {} }

  var DATA = null;
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function btn(text, cls, onClick) {
    var b = el('button', 'btn' + (cls ? ' ' + cls : ''), text);
    b.type = 'button';
    b.addEventListener('click', onClick);
    return b;
  }
  function agent() { return 'Agente ' + (state.nickname || 'M.'); }
  function sub(s) { return String(s == null ? '' : s).split('{agente}').join(agent()); }
  function norm(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
  }
  // Shuffled copy, never left in the right order.
  function shuffle(orig) {
    var a = orig.slice();
    for (var tries = 0; tries < 20; tries++) {
      for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
      if (a.length < 2 || a.some(function (x, k) { return x !== orig[k]; })) break;
    }
    return a;
  }

  // ---- snow ----
  (function () {
    var s = $('snow');
    for (var i = 0; i < 40; i++) {
      var f = document.createElement('i');
      var size = 2 + Math.random() * 5;
      f.style.left = (Math.random() * 100) + 'vw';
      f.style.width = f.style.height = size + 'px';
      f.style.opacity = (0.3 + Math.random() * 0.6).toFixed(2);
      f.style.animationDuration = (8 + Math.random() * 12) + 's';
      f.style.animationDelay = (-Math.random() * 20) + 's';
      s.appendChild(f);
    }
  })();

  // ---- API ----
  var previewDate = null;
  function api(method, body) {
    var url = '/api/avvento' + (method === 'GET' && previewDate ? '?oggi=' + previewDate : '');
    return fetch(url, {
      method: method, cache: 'no-store',
      headers: Object.assign({ 'x-avvento-key': key }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      if (r.status === 403) throw new Error('forbidden');
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    });
  }
  function record(day, event) {
    api('POST', { day: day, event: event, nickname: state.nickname || undefined }).catch(function () {});
  }

  function load() {
    if (!key) { fatal('Manca la chiave nel link. Chiedi il link giusto al papà.'); return; }
    api('GET').then(function (d) {
      DATA = d;
      Object.keys(d.progress || {}).forEach(function (n) {
        var p = d.progress[n] || {};
        if (!d.parent) {
          if (p.solvedAt) state.solved[n] = true;
          if (p.foundAt) state.found[n] = true;
          if (p.nickname && !state.nickname) state.nickname = p.nickname;
        }
      });
      save();
      if (d.parent) {
        $('preview').hidden = false;
        $('previewDate').value = d.today;
      }
      $('title').textContent = d.title || 'Calendario dell’Avvento';
      route();
    }).catch(function (e) {
      if (e.message === 'forbidden') fatal('Questo link non funziona. Chiedi il link giusto al papà.');
      else fatal('Non riesco a collegarmi. Controlla il WiFi e ricarica la pagina.');
    });
  }
  function fatal(text) {
    $('sub').textContent = '';
    var v = $('view'); v.textContent = '';
    var c = el('div', 'card center');
    c.appendChild(el('div', 'big-emoji', '🐰'));
    c.appendChild(el('p', null, text));
    v.appendChild(c);
  }
  $('previewGo').addEventListener('click', function () {
    previewDate = $('previewDate').value || null;
    state = { nickname: state.nickname, solved: {}, found: {}, step: {} };
    load();
  });

  // ---- routing ----
  window.addEventListener('hashchange', route);
  function route() {
    if (!DATA) return;
    var h = location.hash.replace('#', '');
    window.scrollTo(0, 0);
    if (/^g\d{1,2}$/.test(h) && DATA.days[h.slice(1)]) showDay(Number(h.slice(1)));
    else if (h === 'taccuino') showNotebook();
    else showHome();
  }
  function go(h) { if (location.hash === '#' + h) route(); else location.hash = h; }

  // ---- home ----
  var MONTHS = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
  function showHome() {
    var v = $('view'); v.textContent = '';
    var open = Object.keys(DATA.days).length;
    var todayN = Number(DATA.today.slice(8, 10));
    var isDec = DATA.today.slice(0, 7) === DATA.start.slice(0, 7);
    if (!open) {
      var ms = new Date(DATA.start + 'T00:00:00') - new Date(DATA.today + 'T00:00:00');
      var left = Math.round(ms / 86400000);
      $('sub').textContent = left === 1 ? 'Manca 1 giorno al 1° dicembre!' : 'Mancano ' + left + ' giorni al 1° dicembre!';
    } else if (open >= 24) {
      $('sub').textContent = 'Tutte le caselle sono aperte. Buon Natale!';
    } else {
      $('sub').textContent = 'Oggi è il ' + todayN + ' ' + MONTHS[11] + '. Apri la casella di oggi!';
    }
    var top = el('div', 'top');
    if (state.nickname) top.appendChild(el('span', 'badge', '🕵️ ' + agent()));
    if (open) top.appendChild(btn('📒 Taccuino', 'ghost', function () { go('taccuino'); }));
    v.appendChild(top);

    var grid = el('div', 'grid');
    for (var n = 1; n <= 24; n++) {
      (function (n) {
        var day = DATA.days[n];
        var d = el('button', 'door');
        d.type = 'button';
        d.appendChild(el('span', 'n', String(n)));
        if (!day) {
          d.className += ' locked';
          d.appendChild(el('span', 's', '🔒'));
          d.disabled = true;
        } else {
          var done = isDone(n);
          d.className += done ? ' done' : ' open';
          if (isDec && n === todayN) d.className += ' today';
          if (day.gift) d.appendChild(el('span', 'ico', '🎁'));
          d.appendChild(el('span', 's', done ? '✓ risolto' : 'apri!'));
          d.addEventListener('click', function () { go('g' + n); });
        }
        grid.appendChild(d);
      })(n);
    }
    v.appendChild(grid);
  }
  function isDone(n) {
    var day = DATA.days[n];
    if (!day || !state.solved[n]) return false;
    return !day.gift || day.final ? true : !!state.found[n];
  }

  // ---- notebook ----
  function showNotebook() {
    var v = $('view'); v.textContent = '';
    $('sub').textContent = 'Le parole che hai trovato';
    var c = el('div', 'card notebook');
    c.appendChild(el('h2', null, '📒 Il taccuino di ' + agent()));
    var any = false, lastCase = null;
    Object.keys(DATA.days).map(Number).sort(function (a, b) { return a - b; }).forEach(function (n) {
      var day = DATA.days[n];
      if (!day.word || !state.solved[n]) return;
      if (day.case !== lastCase) { c.appendChild(el('h3', null, sub(DATA.cases[day.case] || ''))); lastCase = day.case; }
      c.appendChild(el('span', 'w', day.word));
      any = true;
    });
    if (!any) c.appendChild(el('p', null, 'Ancora vuoto: risolvi gli enigmi per trovare le parole.'));
    v.appendChild(c);
    v.appendChild(btn('← Torna al calendario', 'ghost', function () { go(''); }));
  }

  // ---- day ----
  function showDay(n) {
    var day = DATA.days[n];
    var v = $('view'); v.textContent = '';
    $('sub').textContent = n + ' dicembre';
    v.appendChild(btn('← Calendario', 'ghost', function () { go(''); }));
    v.appendChild(el('div', null)).style.height = '12px';

    if (day.askNickname && !state.nickname) { askNickname(v, n); return; }

    var story = el('div', 'card');
    story.appendChild(el('div', 'case', sub(DATA.cases[day.case] || '')));
    story.appendChild(el('h2', null, sub(day.title)));
    (day.chapter || []).forEach(function (p) { story.appendChild(el('p', null, sub(p))); });
    v.appendChild(story);

    var box = el('div');
    v.appendChild(box);
    renderEnigmas(n, day, box);
  }

  function askNickname(v, n) {
    var c = el('div', 'card center');
    c.appendChild(el('div', 'big-emoji', '🕵️'));
    c.appendChild(el('h2', null, 'Benvenuta, agente!'));
    c.appendChild(el('p', null, 'Ogni detective ha un nome in codice. Il tuo comincerà con "Agente". Scegli il resto!'));
    var inp = el('input'); inp.type = 'text'; inp.maxLength = 20; inp.placeholder = 'es. Stella, Lampo, Volpe Bianca…';
    c.appendChild(inp);
    var msg = el('div', 'msg no');
    var a = el('div', 'actions'); a.style.justifyContent = 'center';
    a.appendChild(btn('Questo è il mio nome!', '', function () {
      var name = inp.value.trim().replace(/^agente\s+/i, '');
      if (!name) { msg.textContent = 'Scrivi un nome!'; return; }
      state.nickname = name.charAt(0).toUpperCase() + name.slice(1);
      save();
      showDay(n);
    }));
    c.appendChild(a); c.appendChild(msg);
    v.appendChild(c);
  }

  function renderEnigmas(n, day, box) {
    box.textContent = '';
    var list = day.enigmas || [];
    var step = state.solved[n] ? list.length : (state.step[n] || 0);
    for (var i = 0; i < list.length; i++) {
      if (i < step) box.appendChild(solvedCard(list[i], i, list.length));
      else { box.appendChild(enigmaCard(list[i], i, list.length, function () {
        state.step[n] = (state.step[n] || 0) + 1;
        if (state.step[n] >= list.length) {
          state.solved[n] = true; record(n, 'solved');
          // last box: the final button means the box is open, so the gift is found too
          if (day.final) { state.found[n] = true; record(n, 'found'); }
        }
        save();
        renderEnigmas(n, day, box);
      })); break; }
    }
    if (step >= list.length) box.appendChild(afterCard(n, day));
  }

  function title(i, total) { return total > 1 ? 'Enigma ' + (i + 1) + ' di ' + total : 'Enigma'; }
  function solvedCard(e, i, total) {
    var c = el('div', 'card');
    c.appendChild(el('div', 'case', title(i, total)));
    c.appendChild(el('div', 'q', sub(e.question)));
    c.appendChild(el('div', 'solved-mark', '✓ Risolto!'));
    return c;
  }

  function enigmaCard(e, i, total, onSolved) {
    var c = el('div', 'card');
    c.appendChild(el('div', 'case', '🔍 ' + title(i, total)));
    c.appendChild(el('div', 'q', sub(e.question)));
    if (e.note) c.appendChild(el('div', 'note', sub(e.note)));
    if (e.clues) {
      var ul = el('ul', 'clues');
      e.clues.forEach(function (t) { ul.appendChild(el('li', null, sub(t))); });
      c.appendChild(ul);
    }
    var msg = el('div', 'msg');
    var hints = el('div');
    var shown = 0;
    function ok() { msg.className = 'msg ok'; msg.textContent = 'Esatto! 🎉'; setTimeout(onSolved, 700); }
    function no(t) { msg.className = 'msg no'; msg.textContent = t || 'Non ancora... riprova!'; }
    var actions = el('div', 'actions');

    if (e.type === 'text' || e.type === 'number') {
      var inp = el('input'); inp.type = 'text';
      inp.setAttribute('autocomplete', 'off'); inp.setAttribute('autocapitalize', 'off'); inp.setAttribute('spellcheck', 'false');
      if (e.type === 'number') inp.inputMode = 'numeric';
      c.appendChild(inp);
      var check = function () {
        var val = norm(inp.value);
        if (!val) return no('Scrivi la risposta!');
        if (e.answers.some(function (a) { return norm(a) === val; })) ok(); else no();
      };
      inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') check(); });
      actions.appendChild(btn('Controlla', '', check));
    } else if (e.type === 'choice') {
      var ch = el('div', 'choices');
      e.options.forEach(function (o, k) {
        var b = btn(sub(o), '', function () { if (k === e.answer) ok(); else { b.className = 'btn wrong'; no(); } });
        ch.appendChild(b);
      });
      c.appendChild(ch);
    } else if (e.type === 'match') {
      var sels = e.rows.map(function (r) {
        var row = el('div', 'row');
        row.appendChild(el('label', null, sub(r.label)));
        var s = el('select');
        s.appendChild(el('option', null, 'scegli…')).value = '';
        e.options.forEach(function (o) { var op = el('option', null, sub(o)); op.value = o; s.appendChild(op); });
        row.appendChild(s); c.appendChild(row);
        return s;
      });
      actions.appendChild(btn('Controlla', '', function () {
        if (sels.some(function (s) { return !s.value; })) return no('Completa tutte le righe!');
        var wrong = e.rows.filter(function (r, k) { return sels[k].value !== r.answer; }).length;
        if (!wrong) ok(); else no(wrong === 1 ? 'Una riga non è giusta. Rileggi gli indizi!' : wrong + ' righe non sono giuste. Rileggi gli indizi!');
      }));
    } else if (e.type === 'order') {
      // placed holds indexes into the shuffled pool
      var line = el('div', 'line'), pool = el('div', 'pieces');
      var order = shuffle(e.pieces), placed = [];
      var draw = function () {
        line.textContent = ''; pool.textContent = '';
        placed.forEach(function (idx, k) {
          var b = el('button', 'piece', order[idx]); b.type = 'button';
          b.addEventListener('click', function () { placed.splice(k, 1); draw(); });
          line.appendChild(b);
        });
        order.forEach(function (p, idx) {
          if (placed.indexOf(idx) >= 0) return;
          var b = el('button', 'piece', p); b.type = 'button';
          b.addEventListener('click', function () { placed.push(idx); draw(); });
          pool.appendChild(b);
        });
        if (!placed.length) line.appendChild(el('span', null, 'Tocca le parole qui sotto nell’ordine giusto')).style.color = '#9aa3b2';
      };
      c.appendChild(line); c.appendChild(pool);
      draw();
      actions.appendChild(btn('Controlla', '', function () {
        if (placed.length < e.pieces.length) return no('Usa tutte le parole!');
        var got = placed.map(function (idx) { return order[idx]; }).join(' ');
        if (got === e.pieces.join(' ')) ok(); else no('L’ordine non è giusto... riprova!');
      }));
      actions.appendChild(btn('Ricomincia', 'light', function () { placed = []; draw(); msg.textContent = ''; }));
    } else if (e.type === 'done') {
      actions.appendChild(btn(sub(e.button || 'Fatto!'), 'green', function () { ok(); }));
    }

    if (e.hints && e.hints.length) {
      var hb = btn('💡 Aiutino', 'light', function () {
        if (shown < e.hints.length) { hints.appendChild(el('div', 'hint', sub(e.hints[shown]))); shown++; }
        if (shown >= e.hints.length) hb.disabled = true;
      });
      actions.appendChild(hb);
    }
    c.appendChild(actions);
    c.appendChild(hints);
    c.appendChild(msg);
    return c;
  }

  function afterCard(n, day) {
    var c = el('div', 'card');
    if (day.after && !day.final) c.appendChild(el('p', null, sub(day.after)));
    if (day.word) {
      var w = el('div', 'word');
      w.appendChild(el('span', null, 'Nuova parola per il taccuino:'));
      w.appendChild(el('b', null, day.word));
      c.appendChild(w);
    }
    if (day.gift) {
      var h = el('div', 'hunt');
      if (day.hunt) h.appendChild(el('span', 'big', '🎁 ' + sub(day.hunt)));
      if (state.found[n]) {
        h.appendChild(el('p', null, sub(day.found)));
        if (day.final && day.after) h.appendChild(el('p', 'big', sub(day.after)));
      } else {
        h.appendChild(btn('L’ho trovato!', 'green', function () {
          state.found[n] = true; save(); record(n, 'found');
          var p = c.parentNode; p.replaceChild(afterCard(n, day), c);
        }));
      }
      c.appendChild(h);
    }
    c.appendChild(el('div', 'actions')).appendChild(btn('← Torna al calendario', 'light', function () { go(''); }));
    return c;
  }

  load();
})();
</script>
</body>
</html>
